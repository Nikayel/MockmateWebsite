number: 6
title: "Ship it"
topic: "Cloud & deployment (AWS)"
goal: "Get Meridian off long-lived AWS keys and out of the upload path: presigned uploads, a real SQS consumer, two scoped IAM roles, secrets in a rotation-safe provider, and a blue/green release with a rollback you have actually executed, and then read the bill your own week of work generated."
standupQuote: "Northwind's 41 MB PDF 504s every single time and the api pod OOMKilled twice tonight; also while I was in there, the key that uploads it is a 412-day-old AKIA in the task definition and it can write any bucket in the account."
archMapDelta:
  added:
    - "Presigned S3 upload flow for document intake, off the request path"
    - "A real SQS consumer driving extraction, with a dead-letter queue"
    - "Two scoped IAM roles (API, extraction worker) provisioned via Terraform"
    - "Secrets loaded from a rotation-safe provider instead of the environment"
    - "A blue/green ECS release with an executed rollback"
  changed:
    - "Document upload no longer streams bytes through the API's own request handler"
  broke:
    - "AWS spend went from $180/mo to $4,900 in the first nine days of this sprint's work"
  invariants:
    - "No long-lived AWS access key exists in any task definition, image, or repository"
    - "Every IAM policy grants only the actions and resource ARNs its own service actually calls, never a wildcard"
objectives:
  - presigned-s3-upload-scoped
  - least-privilege-iam-secrets-rotation
  - sqs-consumer-at-least-once-delivery
  - blue-green-rollback-review
  - cloud-cost-attribution
