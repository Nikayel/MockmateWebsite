number: 3
title: "Tenants: make the database refuse"
goal: "Move tenant isolation out of the WHERE clauses people have to remember to write and into Postgres itself, then find and fix the three bills that move comes with: a pooled-connection context leak, an N+1 you created, and a check-then-insert race the default isolation level was always permitting."
standupQuote: "SUP-2291 · P1 · escalated 07:41 from Continental's ops lead: Why is there a Bekins Van Lines claim in my queue? I opened it. I read the adjuster's notes."
topic: "Databases, transactions & RLS"
archMapDelta:
  added:
    - "Row-level security policies on claims and documents"
  changed:
    - "Tenant scoping moved from an application WHERE clause into a transaction-scoped Postgres session variable"
    - "Claim external references are unique per tenant, enforced by the database"
  invariants:
    - "A query against a tenant-scoped table can only return that transaction's own tenant's rows, enforced by Postgres, not by application code remembering a filter."
    - "Document visibility is derived from the parent claim in the database, not from a tenant key copied onto the document row."
sizingNotes: "MER-302 and MER-305 were originally the thinnest-covered tickets in the sprint: MER-305 had 8 visible cases for a 5-point unassisted concurrency ticket. Both are raised to roughly 15 visible cases each so a learner can watch isolation fail before they submit, not just after grading."
objectives:
  - transaction-scoped-tenant-context
  - row-level-security-policy
  - review-concurrency-fix-pushback
  - n-plus-one-diagnosis-concurrent-index
  - isolation-level-race-condition
