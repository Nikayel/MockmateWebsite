number: 1
title: "Contracts"
goal: "By Friday an invalid claim cannot get past the first line of a handler, every failure carries a code and a status support can quote to a partner, the list endpoint returns each claim exactly once while people are writing to it, and /openapi.json is generated from the same schema objects the server validates with."
standupQuote: "#support-escalations, 08:41: Northwind got a 500 posting a claim their engineer swears is valid, and while I was checking I found 1,900 rows in claims with a null amount that nobody ever rejected."
topic: "TypeScript as a type system · API design & contracts"
archMapDelta:
