number: 4
title: "Delivery: Pay It Once"
goal: "Meridian paid a claim twice last Thursday: by the end of this sprint intake is idempotent, every outbound webhook goes through a transactional outbox with a retry policy you could defend in an incident review, and the ordering guarantee we actually offer is written down and enforced."
standupQuote: "Northwind Mutual, 08:41: You sent us two payment authorizations for CLM-8842, 412ms apart, identical amounts. Finance has already cut both cheques. Who do I talk to?"
topic: "Concurrency & distributed correctness"
archMapDelta:
  added:
    - "Idempotency-key storage for claim intake"
    - "A database-backed transactional outbox drained with expiring SKIP LOCKED leases"
    - "HMAC signing and replay protection on outbound webhooks"
  changed:
    - "Webhook retries follow a capped, jittered backoff with a dead letter queue instead of a fixed retry interval"
  invariants:
    - "A business row and its outbound event are committed together, in the same transaction."
    - "The same idempotency key arriving with a different body is rejected with a 409, never silently reprocessed."
objectives:
  - idempotent-post-with-replay
  - transactional-outbox-skip-locked
  - defensible-retry-policy-backoff-jitter
  - webhook-hmac-verification-review
  - per-claim-ordering-guarantee
