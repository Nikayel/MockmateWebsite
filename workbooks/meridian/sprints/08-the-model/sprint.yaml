number: 8
title: "The model"
topic: "AI engineering in production"
goal: "Replace the regex extractor with a model call you can constrain, retrieve against, cap, cache and stream, without letting one claim be paid on a number the system cannot explain, cannot reproduce, or cannot afford."
standupQuote: "the total-loss Camry came back at $0.00 and your webhook says completed, so we paid it. How many of the other 900 are like that?"
archMapDelta:
  added:
    - "LLM-backed extraction behind a replayable seam (no network, no provider key, in CI)"
    - "JSON-Schema-constrained model output with three distinct typed failure outcomes"
    - "Tenant-scoped policy retrieval, exposed to the extractor as a callable tool, with citations"
    - "A local result cache plus a provider prompt-prefix cache with a documented two-column taxonomy"
  changed:
    - "The regex extractor is replaced entirely by a model call"
  broke:
    - "A total-loss claim was paid on a fabricated $0.00 deductible the extractor could not actually find"
  invariants:
    - "Extraction always returns one of a fixed set of typed outcomes, never a bare guess standing in for one"
    - "Retrieval's tenant and document scope is bound at the call site from the job envelope's tenant, never from anything the model's own output supplies"
sizingNotes: "Points are unchanged from SPRINT-PLAN.md (5/8/8/8/5 = 34), per AUTHORING-RULES.md §3 ('Sprint 8's sizingNotes records the no-breather concern; points unchanged'). Flagging the concern rather than resizing: MER-802, MER-803, and MER-804 are three consecutive 8-point tickets with no lighter ticket between them, unlike every other sprint in the workbook, which alternates weight. Whoever schedules learner pacing for this sprint should expect no natural breather between the second and fourth ticket."
objectives:
  - llm-replayable-seam-typed-abstention
  - constrained-json-output-typed-errors
  - tenant-scoped-policy-retrieval
  - cost-ceiling-cache-key-design
  - review-streaming-pr-hidden-regressions
