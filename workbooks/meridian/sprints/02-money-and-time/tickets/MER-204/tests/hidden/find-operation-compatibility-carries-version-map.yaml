humanName: "Escaped: the compatibility descriptor for GET /claims does not carry a v2 parameter list at all"
tags:
  - backward-compatible-wire-format
kind: io-case
input:
  method: "GET"
  path: "/claims"
expected:
  operationId: "listClaims"
  method: "GET"
  path: "/claims"
  queryParameters:
    - name: "cursor"
      description: "An opaque token naming the last claim already seen; omit it for the first page."
      required: false
    - name: "limit"
      description: "How many claims to return, from 1 up to 100."
      required: false
    - name: "offset"
      description: "The zero-based row offset into the tenant's claim list. v1 only - v2 never had this parameter."
      required: false
      deprecated:
        reason: "Superseded by cursor, which does not shift under concurrent writes."
        sunset: "2026-11-30"
  queryParametersByVersion:
    v2:
      - name: "cursor"
        description: "An opaque token naming the last claim already seen; omit it for the first page."
        required: false
      - name: "limit"
        description: "How many claims to return, from 1 up to 100."
        required: false
entryPoint:
  module: "src/http/compatibility-descriptor.ts"
  export: "findOperationCompatibility"
