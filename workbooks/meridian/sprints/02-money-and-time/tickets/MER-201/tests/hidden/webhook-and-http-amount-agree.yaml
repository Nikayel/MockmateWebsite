humanName: "Escaped: the webhook payload and the HTTP response disagree on the same claim's amount"
tags:
  - exact-money-representation-rounding
kind: probe
body: |
  const { meridian } = buildTestApp()
  return meridian.app
    .inject({
      method: "POST",
      url: "/claims",
      headers: { "x-tenant-id": "ten_northwind" },
      payload: {
        externalRef: "NW-9204",
        amount: 634.02,
        claimantName: "Test Claimant",
        lossDate: "2026-01-01",
      },
    })
    .then((created) => {
      const createdBody = created.json()
      const parsedAgain = parseMoney({ amount: 634.02, currency: "USD" })
      assert(parsedAgain.ok, "634.02 must parse into an exact minor-unit amount")
      const webhookPayload = buildWebhookPayload({
        id: createdBody.id,
        tenantId: "ten_northwind",
        externalRef: "NW-9204",
        status: "submitted",
        money: parsedAgain.value,
        claimantName: "Test Claimant",
        lossDate: "2026-01-01",
        createdAt: createdBody.createdAt,
      })
      assert(
        createdBody.amount === webhookPayload.amount,
        "the HTTP response and the webhook payload must agree on the exact same amount"
      )
    })
