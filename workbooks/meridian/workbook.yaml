# Meridian: the flagship Sprint Labs workbook. Ten sprints on one multi-tenant claims
# platform; see docs/sprint-labs/WORKBOOK-SPEC.md §3 for the pitch and stack, and
# docs/sprint-labs/SPRINT-PLAN.md for the sprint-by-sprint ticket and objective detail this
# objectives vocabulary is drawn from.
id: meridian
title: "Meridian"
pitch: "Join a multi-tenant claims platform as its third engineer and ship ten sprints of real tickets - contracts, money, tenants, delivery, deployment, and the agent's own PRs included."
track: "Systems / Backend"
language: typescript
level: "Mid to Senior"
topics:
  - typescript
  - api-contracts
  - serialization-data-contracts
  - databases-transactions-rls
  - concurrency-distributed-systems
  - containers-environment-parity
  - cloud-deployment-aws
  - observability-operations
  - ai-engineering-production
  - verifying-ai
sprintCount: 10
ticketCount: 50
estimatedHours: 58
requiresServerExecution: false
seedStats:
  files: 59
  nonTestLines: 1449
  testCases: 19
inheritedDefects:
  - "money handled as floating point"
  - "tenant scoping written by hand in each query"
  - "a claims list that pages by offset while people are writing to it"
  - "webhook delivery with no idempotency and no durable retry record"
  - "one shared wire format with no version a client can pin to"
  - "a health check that only proves the process is running, not that it can do useful work"
  - "database migrations that run on every replica's own boot, uncoordinated"
objectives:
  - id: typed-boundary-parsing
    label: "Typed boundary parsing"
    canDo: "I can parse untrusted HTTP input from unknown into a domain type using a discriminated union on status, with no optional-everything interface, so an invalid claim cannot be represented past the first line of a handler."
  - id: error-taxonomy-http-codes
    label: "Error taxonomy and HTTP codes"
    canDo: "I can design an error taxonomy with stable machine-readable codes, correct HTTP statuses, one envelope on every path including the framework's own, and a correlation id that joins a response to its log line."
  - id: keyset-pagination
    label: "Keyset pagination"
    canDo: "I can convert an endpoint from offset to keyset pagination with a tiebreak, a bounded limit, a composite index, and a filter binding, and defend cursor over offset with the duplicate-and-skip mechanism rather than a preference."
  - id: openapi-contract-versioning
    label: "OpenAPI contracts and versioning"
    canDo: "I can generate an OpenAPI 3.1 document from the same schema objects the server validates with, gate it with a contract test that fails the build on drift, and deprecate a breaking change with Deprecation and Sunset headers instead of deleting it."
  - id: review-ai-pr-name-defect
    label: "Reviewing an AI-authored PR"
    canDo: "I can review a green AI-authored PR, name the defect class in one sentence, reject it with the failing test that stops it re-landing, and push back on a confident review comment that is wrong."
  - id: exact-money-representation-rounding
    label: "Exact money and rounding"
    canDo: "I can represent money as an exact value type carrying currency and scale, confine rounding to a single half-even step, and allocate a rounded total across line items so the parts still sum to the whole."
  - id: date-time-zone-modeling
    label: "Date, instant, and time zone modeling"
    canDo: "I can model date-only, instant, and time zone as three distinct types, and compute a calendar-day deadline that survives a daylight-saving transition and a half-hour UTC offset."
  - id: canonical-encoding-audit-hash
    label: "Canonical encoding and audit hashing"
    canDo: "I can write a canonical JSON encoder whose bytes are identical across processes, locales, and a Postgres jsonb round trip, and hash it into an audit record that can actually detect tampering."
  - id: backward-compatible-wire-format
    label: "Backward-compatible wire formats"
    canDo: "I can ship a wire format that changes the type of an existing field without breaking clients I cannot upgrade, using per-subscription version pinning and a stated rule for unknown fields in both directions."
  - id: audit-hash-compatibility-tracing
    label: "Tracing an audit-hash regression"
    canDo: "I can trace an audit-hash mismatch back to a compatibility shim I wrote myself, and pin a hash to the projection it covers so later fields cannot rewrite history."
  - id: row-level-security-policy
    label: "Row-level security policies"
    canDo: "I can write and test a Postgres row-level security policy end to end, ENABLE plus FORCE, USING plus WITH CHECK, across parent and child tables, with a least-privilege application role that is not the table's owner."
  - id: transaction-scoped-tenant-context
    label: "Transaction-scoped tenant context"
    canDo: "I can scope tenant context to a transaction using set_config with is_local true, and prove with a two-tenant pool of size one that a released connection cannot carry that context into the next request."
  - id: n-plus-one-diagnosis-concurrent-index
    label: "N+1 diagnosis and concurrent indexing"
    canDo: "I can diagnose an N+1 introduced by my own correctness fix using query-count assertions and EXPLAIN, design a composite index matching the pagination cursor's ORDER BY, and ship that index against a live table without an ACCESS EXCLUSIVE lock."
  - id: isolation-level-race-condition
    label: "Isolation-level race conditions"
    canDo: "I can name the exact interleaving READ COMMITTED permits in a check-then-insert, and close it with a tenant-scoped unique constraint rather than a bigger lock or a longer transaction."
  - id: review-concurrency-fix-pushback
    label: "Reviewing a concurrency fix"
    canDo: "I can reject a plausible concurrency fix in code review and state, in one paragraph, the precise window it leaves open and why the reviewer's reasoning about connection exclusivity does not hold."
  - id: idempotent-post-with-replay
    label: "Idempotent POST under retries"
    canDo: "I can make a POST endpoint idempotent under client retries by persisting the key with a canonical body fingerprint scoped to the tenant, replaying the original status and body verbatim, and returning 409 when the same key arrives with a different body."
  - id: transactional-outbox-skip-locked
    label: "Transactional outbox with SKIP LOCKED"
    canDo: "I can implement a transactional outbox where the business row and its event commit together, and drain it with FOR UPDATE SKIP LOCKED leases that expire, so two replicas never double-send and a killed poller never parks work."
  - id: defensible-retry-policy-backoff-jitter
    label: "Defensible retry policy design"
    canDo: "I can design a retry policy I can defend in an incident review: classify retryable versus terminal failures, honour Retry-After, cap the exponential before applying jitter, persist attempt state, and dead-letter with the payload intact."
  - id: webhook-hmac-verification-review
    label: "Webhook signing and replay defense"
    canDo: "I can verify a webhook correctly with HMAC over the exact transmitted bytes and the timestamp inside the signed base string, constant-time comparison, and a replay window backed by a seen-id cache and dual-key rotation, and reject a green, plausible, agent-authored security PR that misses one of these."
  - id: per-claim-ordering-guarantee
    label: "Per-claim ordering guarantees"
    canDo: "I can state an ordering guarantee as per-claim rather than global, enforce it with lanes, and demonstrate that one dead destination cannot delay an unrelated tenant's deliveries."
  - id: multistage-docker-image-size-graceful-shutdown
    label: "Multi-stage images and graceful shutdown"
    canDo: "I can write a multi-stage Dockerfile that ships a non-root, dependency-pruned runtime image under 300 MB without changing what it runs, and order shutdown so in-flight webhook deliveries are not duplicated when the container stops."
  - id: boot-time-config-validation
    label: "Boot-time config validation"
    canDo: "I can validate every environment variable once at boot against a typed schema, so a missing secret fails the deploy with a non-zero exit instead of silently signing webhooks with a dev key."
  - id: liveness-readiness-separation
    label: "Liveness versus readiness"
    canDo: "I can split liveness from readiness so a dependency outage removes replicas from rotation instead of restarting the fleet, and prove the difference with a paused database."
  - id: concurrent-safe-schema-migrations
    label: "Concurrency-safe migrations"
    canDo: "I can make schema migrations safe on a multi-replica boot using a Postgres advisory lock, a transactional migration ledger, and a release-phase runner separated from application start."
  - id: review-deploy-change-parity
    label: "Reviewing a deploy change"
    canDo: "I can review an agent-authored deploy change and reject the parts that let local and production diverge, including the rollback the change quietly makes impossible."
  - id: presigned-s3-upload-scoped
    label: "Scoped presigned uploads"
    canDo: "I can move an upload out of my API's request path with a presigned S3 upload scoped to one tenant, one key, one content type, and one size ceiling, verified server-side before it counts as received."
  - id: least-privilege-iam-secrets-rotation
    label: "Least-privilege IAM and secret rotation"
    canDo: "I can write an IAM policy from the application's actual call sites with no wildcard actions and no wildcard resource ARNs, prove it with a policy-simulation test in CI, and get every secret out of the environment and the image into a cached, rotation-safe provider."
  - id: sqs-consumer-at-least-once-delivery
    label: "At-least-once SQS consumers"
    canDo: "I can operate a long-lived SQS consumer correctly under at-least-once delivery: visibility timeout matched to p99, heartbeat extension with a ceiling, partial batch deletes, DLQ redrive, and a SIGTERM drain that releases in-flight work."
  - id: blue-green-rollback-review
    label: "Blue/green rollback review"
    canDo: "I can ship a blue/green release with an expand-then-contract migration, execute the rollback under live traffic, and review an agent-authored version of that change for the failure modes a rollback cannot fix."
  - id: cloud-cost-attribution
    label: "Cloud cost attribution"
    canDo: "I can read an AWS cost-and-usage export and attribute a large bill increase to specific lines of my own code, then bring it down without deleting the observability."
  - id: request-scoped-structured-logging
    label: "Request-scoped structured logs"
    canDo: "I can instrument a service with request-scoped structured logs carrying trace, tenant, and claim identity, without leaking PII or letting one request's context bleed into another's under concurrency."
  - id: distributed-trace-context-propagation
    label: "Trace context across async boundaries"
    canDo: "I can propagate W3C trace context across an asynchronous boundary, from an HTTP request to an outbox row to a queue message to a delivery worker, so a claim and its retried webhooks read as one causal story."
  - id: latency-regression-diagnosis-wait-vs-service-time
    label: "Latency regression diagnosis"
    canDo: "I can read a distributed trace to locate a p99 regression that lives in the gaps between spans, separate wait time from service time including event-loop delay, and prove the diagnosis with a test that is red before the fix and green after."
  - id: slo-error-budget-burn-rate-alerts
    label: "SLOs and burn-rate alerts"
    canDo: "I can turn an uptime promise into a written SLI, an error budget, and multi-window burn-rate alerts, then replay those alerts against real incident data to show they fire for the incident and not for the quiet week."
  - id: review-postmortem-systemic-causes
    label: "Reviewing a postmortem"
    canDo: "I can review an AI-drafted postmortem and rewrite it so it names systemic causes rather than a person or a trigger, with every action item attached to a test or a named owner."
  - id: llm-replayable-seam-typed-abstention
    label: "Replayable LLM seam"
    canDo: "I can put an LLM behind a replayable seam so the entire extraction path runs in CI with no network and no provider key, and a model or prompt change shows up as a diff instead of a surprise."
  - id: constrained-json-output-typed-errors
    label: "Constrained output and typed failures"
    canDo: "I can constrain model output with a JSON Schema generated from the same source the code validates against, and handle schema-invalid, timed-out, and rate-limited responses as three distinct typed outcomes rather than one catch block."
  - id: tenant-scoped-policy-retrieval
    label: "Tenant-scoped policy retrieval"
    canDo: "I can build tenant-scoped retrieval over policy documents that cites the chunks it used and resolves the revision in force on the loss date, not the newest one."
  - id: cost-ceiling-cache-key-design
    label: "Cost ceilings and cache keys"
    canDo: "I can enforce a hard cost-per-claim ceiling before the spend happens, accounting for tokens burned on repair turns and cache hits, and derive a cache key from everything the answer depends on so a semantic near-match is never mistaken for an extraction match."
  - id: review-streaming-pr-hidden-regressions
    label: "Reviewing a streaming PR"
    canDo: "I can review a streaming PR that is green, fast, and wrong, and name which of its changes produce a wrong payout, a silent bill, and an SLO alert that will never fire again."
  - id: golden-eval-set-per-slice-scoring
    label: "Golden eval sets and per-slice scoring"
    canDo: "I can build a golden eval set with human-labelled ground truth, per-field and per-slice scoring, and deterministic offline replay, and defend why a single accuracy number cannot be a release gate."
  - id: block-regressing-model-change-review
    label: "Blocking a regressing model change"
    canDo: "I can block a prompt or model change that improves the headline metric while regressing a named subpopulation, using a baseline pinned to a dataset revision, and review an agent-authored PR that is green on every existing test by stating a verdict with evidence and writing the test that turns it red."
  - id: prompt-injection-defense-tool-scoping
    label: "Prompt injection defense"
    canDo: "I can defend an LLM pipeline against prompt injection by removing authorization from the model's control surface, fencing untrusted input as data, and validating output before it leaves via webhook, log, or error message."
  - id: prompt-cache-prefix-cost-regression
    label: "Prompt cache prefix regressions"
    canDo: "I can trace a cost and latency regression to a broken prompt-cache prefix and repair it without weakening the security control that caused it or leaking one tenant's cached context to another."
  - id: rejected-extraction-first-class-outcome
    label: "Rejected extraction as an outcome"
    canDo: "I can design a rejected extraction as a first-class outcome, tenant-scoped, non-retryable, published through the outbox, and observable, instead of a claim that silently disappears."
  - id: review-agent-pr-defensible-verdict
    label: "Defensible agent-PR verdicts"
    canDo: "I can review an agent-authored pull request that has green CI and return a defensible verdict, approve, reject, or request changes, with a repro test that fails on the branch and passes on main."
  - id: multi-process-concurrency-bug-repro
    label: "Multi-process concurrency bugs"
    canDo: "I can diagnose a concurrency defect that only manifests across more than one process, and pin it in CI with a multi-worker harness that reproduces it deterministically."
  - id: expand-backfill-contract-migration
    label: "Expand, backfill, contract migrations"
    canDo: "I can rewrite a destructive schema change as expand, backfill, then contract, so it stays reversible and non-blocking while the previous version of the application is still serving traffic."
  - id: ci-gates-migration-safety-queue-conformance
    label: "CI gates for unsafe changes"
    canDo: "I can build the CI gates that make an entire class of unsafe change fail, a migration-safety check and a queue drain-conformance harness, including the baseline and the skip-loudly behaviour that keep a gate alive past its first week."
  - id: incident-response-absolute-retry-deadline
    label: "Incident response and retry deadlines"
    canDo: "I can run a P1 from page to postmortem, mitigate first, separate the trigger from the root cause, bound retries by an absolute deadline rather than an attempt count, and push back on a confident but wrong review comment about why raising a timeout during an incident hides a feedback loop instead of breaking it."
