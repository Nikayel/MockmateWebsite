name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        # Version is read from the "packageManager" field in package.json.
        # v6 targets the Node 24 runner; v4 tripped GitHub's Node 20 deprecation
        # warning on every run.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript check
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        # Version is read from the "packageManager" field in package.json.
        # v6 targets the Node 24 runner; v4 tripped GitHub's Node 20 deprecation
        # warning on every run.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        # Version is read from the "packageManager" field in package.json.
        # v6 targets the Node 24 runner; v4 tripped GitHub's Node 20 deprecation
        # warning on every run.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Minimal env vars for build to succeed.
          #
          # app/api/create-checkout/route.ts throws at MODULE EVAL when
          # STRIPE_SECRET_KEY is absent, so every build here failed on it and this
          # job was red 100 times out of 100. A permanently-red gate trains you to
          # ignore it, which is worse than having no gate: the only thing actually
          # protecting production was tsc inside next build.
          #
          # These are structurally valid dummies, never real keys. Stripe is never
          # called during a build; only the module-eval guard is being satisfied.
          NEXT_PUBLIC_FIREBASE_API_KEY: dummy
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: dummy.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 123456789
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:abc123
          STRIPE_SECRET_KEY: sk_test_dummy_ci_build_only
          STRIPE_WEBHOOK_SECRET: whsec_dummy_ci_build_only
