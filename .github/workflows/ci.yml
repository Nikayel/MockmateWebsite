name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        # Version is read from the "packageManager" field in package.json.
        # v6 targets the Node 24 runner; v4 tripped GitHub's Node 20 deprecation
        # warning on every run.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript check
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        # Version is read from the "packageManager" field in package.json.
        # v6 targets the Node 24 runner; v4 tripped GitHub's Node 20 deprecation
        # warning on every run.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        # Version is read from the "packageManager" field in package.json.
        # v6 targets the Node 24 runner; v4 tripped GitHub's Node 20 deprecation
        # warning on every run.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Minimal env vars for build to succeed.
          #
          # app/api/create-checkout/route.ts throws at MODULE EVAL when
          # STRIPE_SECRET_KEY is absent, so every build here failed on it and this
          # job was red 100 times out of 100. A permanently-red gate trains you to
          # ignore it, which is worse than having no gate: the only thing actually
          # protecting production was tsc inside next build.
          #
          # These are structurally valid dummies, never real keys. Stripe is never
          # called during a build; only the module-eval guard is being satisfied.
          NEXT_PUBLIC_FIREBASE_API_KEY: dummy
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: dummy.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 123456789
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:abc123
          STRIPE_SECRET_KEY: sk_test_dummy_ci_build_only
          STRIPE_WEBHOOK_SECRET: whsec_dummy_ci_build_only

      # The SEO gate rides this job rather than getting its own, because the only expensive thing
      # it needs is the build that just finished. A separate job would pay for a second checkout,
      # install, and `next build` to audit bytes identical to these.
      #
      # It crawls the SERVED output, not the source: a `metadata` export can be perfect while the
      # rendered page ships two <h1>s from a shared layout, or ships an empty shell because the
      # content moved behind a useEffect. Only the response can show that.
      - name: Start built server
        run: |
          pnpm start -p 4256 &
          echo $! > /tmp/seo-audit-server.pid
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:4256/robots.txt; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not answer /robots.txt within 60s"; exit 1
        env:
          # `next start` re-reads these at runtime; same structurally-valid dummies as the build.
          NEXT_PUBLIC_FIREBASE_API_KEY: dummy
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: dummy.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 123456789
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:abc123
          STRIPE_SECRET_KEY: sk_test_dummy_ci_build_only
          STRIPE_WEBHOOK_SECRET: whsec_dummy_ci_build_only

      # `--sample-lessons=25` thins only the ~425 templated lesson URLs. Every distinct non-lesson
      # page is still crawled in full, because those are the hand-authored ones where a one-off
      # metadata defect can hide. A local run with no flag covers all of them.
      #
      # KNOWN RED ON ARRIVAL. The first crawl of the site as it stood on 2026-08-16 found two real
      # defects, so this step fails until they are fixed:
      #   - /legal ships no rel=canonical
      #   - /python-executor renders 72 visible characters of main content server-side
      # Both are content fixes, not check-tuning: the threshold sits in a wide gap (the next
      # thinnest page has 391 characters) and every other one of the 549 sitemap URLs passes. A
      # permanently-red gate trains people to ignore it, which is the failure mode the Build job's
      # own comment above was written about, so fix the two pages rather than letting this sit red.
      # If the fixes must land after this workflow, add `continue-on-error: true` HERE and delete it
      # in the same PR that fixes them. Do not weaken scripts/seo-audit.mjs to go green.
      - name: SEO audit
        run: pnpm seo:audit --sample-lessons=25 --base-url=http://localhost:4256

      - name: Upload SEO audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-report
          path: artifacts/seo-audit/
          if-no-files-found: warn

      - name: Stop built server
        if: always()
        run: kill "$(cat /tmp/seo-audit-server.pid)" 2>/dev/null || true
