<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- CodeSparring Favicon - simplified version -->

  <!-- Left bracket < -->
  <path
    d="M11 8L4 16L11 24"
    stroke="#00d9ff"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right bracket > -->
  <path
    d="M21 8L28 16L21 24"
    stroke="#00ff88"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Lightning spark -->
  <path
    d="M17.5 10L15 15.5H17.5L15 22"
    stroke="url(#spark)"
