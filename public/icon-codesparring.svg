    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <defs>
    <linearGradient id="spark" x1="15" y1="10" x2="17.5" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#00ff88"/>
    </linearGradient>
  </defs>
</svg>
