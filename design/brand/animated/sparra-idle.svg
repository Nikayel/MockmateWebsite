<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    /* Self-contained on purpose: external CSS never applies inside an img
       element, so without this the classes below are inert. That also left the
       shut-eyes group (.s) painted permanently on top of the open one (.o),
       because nothing was setting its base opacity to 0. */
    @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
    @keyframes op { 0%, 92%, 100% { opacity: 1 } 94%, 98% { opacity: 0 } }
    @keyframes sh { 0%, 92%, 100% { opacity: 0 } 94%, 98% { opacity: 1 } }
    .b { animation: bob 3.4s ease-in-out infinite }
    .o { animation: op 4.6s linear infinite }
    .s { opacity: 0; animation: sh 4.6s linear infinite }
    @media (prefers-reduced-motion: reduce) {
      .b, .o, .s { animation: none }
    }
  </style>
  <defs><linearGradient id="sgi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"></stop><stop offset=".55" stop-color="#ff8a3d"></stop><stop offset="1" stop-color="#e0552a"></stop></linearGradient></defs>
  
  <g class="b">
    <rect width="64" height="64" rx="17" fill="url(#sgi)"></rect>
    <g transform="translate(10.88 10.88) scale(0.66)" stroke="#2a1206" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <g class="o">
        <path d="M20 24 14 32 20 40" stroke-width="6"></path>
        <path d="M44 24 50 32 44 40" stroke-width="6"></path>
      </g>
      <g class="s">
        <path d="M14 32 21 32" stroke-width="6"></path>
        <path d="M43 32 50 32" stroke-width="6"></path>
      </g>
      <path d="M27 44Q32 49 37 44" stroke-width="5"></path>
    </g>
  </g>
</svg>